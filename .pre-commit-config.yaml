repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: python -m ruff check
        language: system
        types: [python]
        exclude: ^scripts/ghidra/ExportFunctions.py$
      - id: ruff-format
        name: Ruff format
        entry: python -m ruff format --check
        language: system
        types: [python]
        exclude: ^scripts/ghidra/ExportFunctions.py$
      - id: mypy
        name: Mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        types: [python]
