[build-system]
requires = ["setuptools>=77,<85", "wheel>=0.41,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "arcanacart"
version = "0.4.2"
description = "Offline GBA binary analysis, safe UPS patching and evidence-driven semantic extraction"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
authors = [{name = "ArcanaCart contributors"}]
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.14.0", "mypy==1.18.2", "jsonschema==4.25.1", "build==1.3.0", "pre-commit==4.3.0"]

[project.scripts]
arcanacart = "arcanacart.cli:main"
feunpack = "arcanacart.cli:legacy_main"

[tool.setuptools.packages.find]
include = ["arcanacart*", "feunpack*"]

[tool.setuptools.package-data]
"arcanacart.schemas" = ["*.json"]
"arcanacart.disassembly" = ["scripts/*.java"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["scripts/ghidra/ExportFunctions.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.10"
files = ["arcanacart", "feunpack"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
